name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run cli:pack
      - run: bun run docs:build
      - run: bun run gateway:generate --check
      - name: Gate synthetic gateway evaluations
        run: bun scripts/gateway-eval.ts fixture

  python-package:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      matrix:
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ./packages/python
      - run: python -m unittest discover -s packages/python/tests
