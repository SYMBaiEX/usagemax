name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run cli:pack
      - run: bun run docs:build
      - run: bun run gateway:generate --check
      - name: Gate synthetic gateway evaluations
        run: bun scripts/gateway-eval.ts fixture
