name: Publish Python SDK

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version declared in packages/python/pyproject.toml
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-python
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'SYMBaiEX/usagemax' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Verify the requested release version
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          with Path("packages/python/pyproject.toml").open("rb") as metadata:
              version = tomllib.load(metadata)["project"]["version"]
          if version != os.environ["EXPECTED_VERSION"]:
              raise SystemExit(f"The release version in pyproject.toml is {version}")
          PY
      - name: Build and validate both distributions
        run: |
          python -m pip install build twine
          python -m build --outdir dist packages/python
          python -m twine check --strict dist/*
      - name: Run tests against the installed wheel
        run: |
          python -m pip install --no-deps dist/*.whl
          python -m unittest discover -s packages/python/tests
      - uses: actions/upload-artifact@v7
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/usagemax/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
